[package]
name = "astra_hotkey"
version = "0.1.0"
edition = "2021"
description = "Native global hotkey service for Astra AI assistant"
license = "LicenseRef-Proprietary"
repository = "https://github.com/misha/astra-hotkey"

[lib]
name = "astra_hotkey"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19"
parking_lot = "0.12"
# The id-based ABI (hotkey_set_shortcuts / hotkey_get_bindings) carries its
# JSON payloads across the C boundary. serde lives here (not under a target)
# because `backend.rs`'s `ShortcutSpec`/`ShortcutBinding` are cross-platform.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# X11 sessions: global-hotkey (silent XGrabKey, no perms). It runs its own
# internal X11 event thread; the manager is Send so register/unregister happen
# from the C ABI thread. Replaces the old non-functional XGrabKey stub.
global-hotkey = "0.6"
# Wayland sessions: the GlobalShortcuts XDG portal via ashpd (async D-Bus) —
# the cdylib runs its own current-thread tokio runtime on a background thread
# (the portal "actor"). futures-util gives us StreamExt::next for the signal
# streams in the select loop.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Runtime session detection (x11 vs wayland) handled via env in linux.rs.

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
