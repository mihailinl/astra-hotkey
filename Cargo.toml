[package]
name = "astra_hotkey"
version = "0.1.0"
edition = "2021"
description = "Native global hotkey service for Astra AI assistant"
license = "LicenseRef-Proprietary"
repository = "https://github.com/misha/astra-hotkey"

[lib]
name = "astra_hotkey"
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
